<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Шахматы</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <div id="status"></div>
    <div id="board"></div>
    <div id="error" role="alert"></div>
    <label>Соперник:
      <select id="opponent">
        <option value="human">Человек (за одним экраном)</option>
        <option value="greedy">Жадный бот</option>
        <option value="advanced">Продвинутый бот</option>
      </select>
    </label>
    <button id="new-game" type="button">Новая партия</button>
    <section>
      <h2>Ходы</h2>
      <ol id="history"></ol>
    </section>
  </main>

  <div id="promotion" class="overlay" hidden>
    <div class="dialog">
      <p>Превратить пешку в:</p>
      <button type="button" data-piece="q">Ферзь</button>
      <button type="button" data-piece="r">Ладья</button>
      <button type="button" data-piece="b">Слон</button>
      <button type="button" data-piece="n">Конь</button>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
